name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the builds to the release on tag pushes

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15 # arm64; macos-14 images are retired ("macos-14-arm64-us-default is not supported")
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-apple-silicon

      - name: Build Apple Silicon app + DMG
        id: dmg
        run: packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          # Race-safe with the linux and windows jobs: whoever loses the create sees it exists.
          # Draft until every build is attached, so /releases/latest never points at a half release.
          # Notes come from CHANGELOG.md (also shown on wholeseek.utilitygods.com/changelog).
          .github/scripts/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --draft --title "wholeseek $TAG" --notes-file notes.md 2>/dev/null \
            || gh release view "$TAG" >/dev/null
          # Stable name so websites can link to
          # https://github.com/Utility-Gods/wholeseek/releases/latest/download/wholeseek-macos-apple-silicon.dmg
          stable="$(dirname "$DMG")/wholeseek-macos-apple-silicon.dmg"
          cp "$DMG" "$stable"
          gh release upload "$TAG" "$DMG" "$stable" --clobber

  linux:
    # Oldest supported Ubuntu runner → oldest glibc → runs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev librsvg2-bin \
            libxkbcommon-dev libxkbcommon-x11-dev # xkbcommon crate links -lxkbcommon

      - name: Build tarball
        id: tar
        run: packaging/linux/build-tarball.sh

      - name: Show glibc floor
        run: |
          objdump -T target/release/wholeseek | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ldd target/release/wholeseek

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.tar.outputs.name }}
          path: ${{ steps.tar.outputs.tarball }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tar.outputs.tarball }}
        run: |
          # Draft until every build is attached, so /releases/latest never points at a half release.
          # Notes come from CHANGELOG.md (also shown on wholeseek.utilitygods.com/changelog).
          .github/scripts/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --draft --title "wholeseek $TAG" --notes-file notes.md 2>/dev/null \
            || gh release view "$TAG" >/dev/null
          # Stable name: .../releases/latest/download/wholeseek-linux-x86_64.tar.gz
          stable="$(dirname "$TARBALL")/wholeseek-linux-x86_64.tar.gz"
          cp "$TARBALL" "$stable"
          gh release upload "$TAG" "$TARBALL" "$stable" --clobber

  windows:
    runs-on: windows-latest # x86_64, MSVC toolchain; the Windows SDK's rc.exe embeds icon + version
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build zip
        id: zip
        run: packaging/windows/build-zip.sh

      - name: Show the exe's version info and imports
        shell: pwsh
        run: |
          $exe = "target/release/wholeseek.exe"
          (Get-Item $exe).VersionInfo | Format-List FileDescription, FileVersion, ProductVersion, LegalCopyright
          # Subsystem 2 = Windows GUI (no console window); 3 would be a console app.
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3c)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          "PE subsystem: $sub"
          if ($sub -ne 2) { throw "wholeseek.exe is not a GUI-subsystem exe" }
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne "${{ steps.zip.outputs.version }}") { throw "version info missing" }
          # Static CRT: no Visual C++ Redistributable needed on the user's machine.
          if ([Text.Encoding]::ASCII.GetString($b) -match 'VCRUNTIME140') { throw "wholeseek.exe needs VCRUNTIME140.dll" }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          # Draft until every build is attached, so /releases/latest never points at a half release.
          # Notes come from CHANGELOG.md (also shown on wholeseek.utilitygods.com/changelog).
          .github/scripts/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --draft --title "wholeseek $TAG" --notes-file notes.md 2>/dev/null \
            || gh release view "$TAG" >/dev/null
          # Stable name: .../releases/latest/download/wholeseek-windows-x86_64.zip
          stable="$(dirname "$ZIP")/wholeseek-windows-x86_64.zip"
          cp "$ZIP" "$stable"
          gh release upload "$TAG" "$ZIP" "$stable" --clobber

  publish:
    # Every build is attached: publish the draft and make it the latest release in one step.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  verify-site-links:
    # After the release is published, prove the website's download links serve it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: wholeseek.utilitygods.com/download/* resolve to this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for kind in mac linux windows; do
            ok=
            for try in 1 2 3 4 5 6; do
              hops=$(curl -sIL "https://wholeseek.utilitygods.com/download/$kind" | tr -d '\r' | grep -i '^location:' || true)
              code=$(curl -sL -o /dev/null -r 0-0 -w '%{http_code}' "https://wholeseek.utilitygods.com/download/$kind")
              echo "$kind try $try: $code"; echo "$hops" | sed -E 's/\?.*//'
              if echo "$hops" | grep -q "/releases/download/$TAG/" && { [ "$code" = 206 ] || [ "$code" = 200 ]; }; then ok=1; break; fi
              sleep 20
            done
            [ -n "$ok" ] || { echo "::error::/download/$kind does not serve $TAG"; exit 1; }
          done
