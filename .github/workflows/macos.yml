name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the DMG to the release on tag pushes

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15 # arm64; macos-14 images are retired ("macos-14-arm64-us-default is not supported")
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-apple-silicon

      - name: Build Apple Silicon app + DMG
        id: dmg
        run: packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$DMG" --clobber
