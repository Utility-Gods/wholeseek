name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The same gate the Tech Lead runs before every merge: fmt, clippy -D warnings, all tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux-x86_64

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            ffmpeg # audio tests generate their fixtures with ffmpeg

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace
