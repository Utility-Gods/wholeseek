<style>
*{box-sizing:border-box}
html{background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{margin:0}
main{max-width:1120px;margin:0 auto;padding:56px 24px 0;text-align:center}
.logo{display:block;width:64px;height:64px;margin:0 auto}
h1{font-size:34px;font-weight:650;line-height:1.1;letter-spacing:-.01em;margin:16px 0 6px}
.tag{color:#94a3b8;font-size:17px;margin:0}
.dl{display:flex;justify-content:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:12px;min-width:232px;padding:9px 18px 9px 14px;border-radius:6px;border:1px solid #1e293b;background:#111a2c;color:#e2e8f0;text-decoration:none;text-align:left;transition:background-color 80ms,border-color 80ms}
.btn:hover{background:#1e293b}
.btn svg{width:22px;height:22px;flex:none}
.btn b{display:block;font-size:15px;font-weight:600}
.btn small{display:block;font-size:12.5px;color:#94a3b8}
.btn.primary{background:#fb923c;border-color:#fb923c;color:#0f172a}
.btn.primary small{color:#7c2d12}
.btn.primary:hover{background:#fdba74;border-color:#fdba74}
.btn:focus-visible,.gh:focus-visible{outline:2px solid #fb923c;outline-offset:3px}
.hint{color:#94a3b8;opacity:.8;font-size:12.5px;margin:12px 0 0}
.gh{display:inline-flex;align-items:center;gap:7px;margin-top:14px;color:#94a3b8;font-size:14px;text-decoration:none;transition:color 80ms}
.gh:hover{color:#e2e8f0}
.gh svg{width:16px;height:16px}
.shot{margin:40px 0 0;border:1px solid #1e293b;border-radius:6px;overflow:hidden;background:#111a2c}
.shot img{display:block;width:100%;height:auto}
footer{max-width:1120px;margin:0 auto;padding:20px 24px 32px;color:#94a3b8;font-size:12.5px;text-align:center}
@media (max-width:600px){main{padding:40px 16px 0}h1{font-size:30px}.tag{font-size:16px}.dl{flex-direction:column;align-items:stretch}.btn{min-width:0}.shot{margin-top:32px}}
</style>
