[package]
name = "wholeseek-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis", "caf", "isomp4", "mkv", "ogg", "aiff", "wav", "ape", "id3v1", "id3v2"] }
cpal = { version = "0.18.2", optional = true }

[features]
default = ["output"]
output = ["dep:cpal"]

[dev-dependencies]
tempfile = "3"
wholeseek-core.workspace = true

[[example]]
name = "live_play"
required-features = ["output"]
